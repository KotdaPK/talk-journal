[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "talk-journal"
version = "0.1.0"
description = "Local speech-to-text for files and folders using IBM Granite Speech and Silero VAD"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.11,<2.15",
    "torchaudio>=2.11,<2.15",
    "transformers>=4.52.1,<5",
    "accelerate>=1,<2",
    "silero-vad>=6,<7",
    "soundfile>=0.13,<1",
    "imageio-ffmpeg>=0.6,<1",
]

[project.scripts]
talk-journal = "transcribe_folder:main"

[tool.setuptools]
py-modules = ["transcribe_folder"]
